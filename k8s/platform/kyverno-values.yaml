# Kyverno enxuto para o cluster local
admissionController:
  replicas: 1
backgroundController:
  enabled: true
reportsController:
  enabled: true      # gera PolicyReports (visíveis no Freelens e via kubectl)
cleanupController:
  enabled: false     # não usamos CleanupPolicies
# Sem valores, os charts geram "labels: {}" / "annotations: {}" nos CRDs; o Kubernetes
# descarta o mapa vazio (fica null) e o Argo CD mostra o app kyverno eternamente OutOfSync.
crds:
  customLabels:                     # CRDs de kyverno.io e reports.kyverno.io
    app.kubernetes.io/part-of: kyverno
kyverno-api:                        # CRDs de policies.kyverno.io (subchart kyverno-api)
  labels:
    app.kubernetes.io/part-of: kyverno
  annotations:
    matiassystem.io/managed-by: argocd
