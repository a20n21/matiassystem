# Todo pod dos ambientes da aplicação precisa do mesmo hardening que o Trivy exige no PR.
# O PR pega o erro cedo; esta política garante que nada fora do Git (kubectl à mão) escape.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pod-hardening
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # Vale para os namespaces marcados nos overlays (k8s/overlays/*/namespace.yaml)
    namespaceSelector:
      matchLabels:
        matiassystem.io/policies: enforced
  validations:
    - message: "Pod precisa de runAsNonRoot: true (no pod ou em todos os containers)."
      expression: >-
        (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot)
          && object.spec.securityContext.runAsNonRoot == true)
        || object.spec.containers.all(c, has(c.securityContext)
          && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)
    - message: "Containers precisam de allowPrivilegeEscalation: false."
      expression: >-
        object.spec.containers.all(c, has(c.securityContext)
          && has(c.securityContext.allowPrivilegeEscalation)
          && c.securityContext.allowPrivilegeEscalation == false)
    - message: "Containers precisam de readOnlyRootFilesystem: true."
      expression: >-
        object.spec.containers.all(c, has(c.securityContext)
          && has(c.securityContext.readOnlyRootFilesystem)
          && c.securityContext.readOnlyRootFilesystem == true)
    - message: "Containers precisam remover todas as capabilities (capabilities.drop: [ALL])."
      expression: >-
        object.spec.containers.all(c, has(c.securityContext)
          && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop)
          && 'ALL' in c.securityContext.capabilities.drop)
    - message: "Containers precisam de limites de CPU e memória."
      expression: >-
        object.spec.containers.all(c, has(c.resources) && has(c.resources.limits)
          && 'cpu' in c.resources.limits && 'memory' in c.resources.limits)
