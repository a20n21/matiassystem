# Traefik no nó control-plane, que recebe as portas 80/443 do Windows (extraPortMappings do kind)
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
# Sem LoadBalancer no kind (ficaria <pending> e o Argo CD marcaria "Progressing")
service:
  spec:
    type: ClusterIP

# hostPort 80/443 só cabe um pod por nó: derruba o antigo antes de subir o novo
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Sem LoadBalancer no kind, o Traefik não preenche o ADDRESS dos Ingress.
# O Argo CD precisa desse campo para marcar o Ingress como Healthy.
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
