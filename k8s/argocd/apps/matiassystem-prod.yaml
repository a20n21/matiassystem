apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matiassystem-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:a20n21/matiassystem.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: matiassystem-prod
  # A aprovação acontece antes, no Git (Environment "production" + PR de promoção).
  # Depois do merge, o Argo CD só aplica.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true   
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: matiassystem
      jsonPointers:
        - /spec/replicas
