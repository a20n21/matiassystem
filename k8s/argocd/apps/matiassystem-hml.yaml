apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matiassystem-hml
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:a20n21/matiassystem.git
    targetRevision: main
    path: k8s/overlays/hml
  destination:
    server: https://kubernetes.default.svc
    namespace: matiassystem-hml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
