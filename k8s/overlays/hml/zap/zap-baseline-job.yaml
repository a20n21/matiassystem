# DAST na homologação: o Argo CD roda este Job depois de cada sync da hml (PostSync).
# Se o ZAP encontrar uma regra FAIL (zap/rules.tsv), o Job falha e o sync da hml
# aparece como falho no Argo CD — sinal para NÃO aprovar a promoção para prod.
apiVersion: batch/v1
kind: Job
metadata:
  name: zap-baseline
  annotations:
    argocd.argoproj.io/hook: PostSync
    # Mantém o último Job (e seus logs) até o próximo sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: zap-baseline
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # usuário "zap" da imagem
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: wrk
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: rules
          configMap:
            name: zap-rules
      initContainers:
        # O ZAP espera rules.tsv em /zap/wrk, que precisa ser gravável (relatórios)
        - name: copy-rules
          image: ghcr.io/zaproxy/zaproxy:2.16.1
          command: ["cp", "/rules/rules.tsv", "/zap/wrk/rules.tsv"]
          volumeMounts:
            - name: rules
              mountPath: /rules
            - name: wrk
              mountPath: /zap/wrk
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: zap
          image: ghcr.io/zaproxy/zaproxy:2.16.1
          # -c: regras FAIL/IGNORE; -I: WARN não falha o Job (só FAIL)
          args: ["zap-baseline.py", "-t", "http://matiassystem", "-c", "rules.tsv", "-I"]
          volumeMounts:
            - name: wrk
              mountPath: /zap/wrk
            - name: home
              mountPath: /home/zap
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
