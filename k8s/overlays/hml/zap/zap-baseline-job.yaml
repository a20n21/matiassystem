# DAST na homologação: o Argo CD roda este Job depois de cada sync da hml (PostSync).
# 1. O ZAP ataca o site. Uma regra FAIL (zap/rules.tsv) faz o Job falhar.
# 2. O resultado vira um commit status no GitHub (security/zap-hml), no commit da
#    versão testada. O workflow "promote" (prod) só pede aprovação se ele for success.
apiVersion: batch/v1
kind: Job
metadata:
  name: zap-baseline
  annotations:
    argocd.argoproj.io/hook: PostSync
    # Mantém o último Job (e seus logs) até o próximo sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: zap-baseline
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # usuário "zap" da imagem
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: wrk
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: zap
      containers:
        - name: zap
          image: ghcr.io/zaproxy/zaproxy:2.16.1
          command: ["sh", "/scripts/run.sh"]
          env:
            - name: TARGET
              value: http://matiassystem
            - name: GITHUB_REPOSITORY
              value: a20n21/matiassystem
            # Token fine-grained só com "Commit statuses: write" neste repositório.
            # Criado à mão (fora do Git). Sem ele o ZAP roda, mas não publica o status.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zap-github-status
                  key: token
                  optional: true
          volumeMounts:
            - name: wrk
              mountPath: /zap/wrk
            - name: home
              mountPath: /home/zap
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 768Mi, ephemeral-storage: 256Mi}
            limits: {cpu: "1", memory: 1536Mi, ephemeral-storage: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
