apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: matiassystem-hml
labels:
  - pairs:
      env: hml
resources:
  - namespace.yaml
  - ../../base
  - zap/zap-baseline-job.yaml # DAST (ZAP) depois de cada sync
configMapGenerator:
  - name: zap
    files:
      - zap/rules.tsv
      - zap/run.sh
      - zap/post_status.py
# Atualizado pelo workflow "promote" (dev → hml)
images:
  - name: matiassystem
    newName: ghcr.io/a20n21/matiassystem
    newTag: "9ec3e77"
replicas:
  - name: matiassystem
    count: 1
patches:
  - target:
      kind: Ingress
      name: matiassystem
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hml.matiassystem.localhost
  # Ambiente de teste: reserva menor que prod (requests só reservam; limits limitam)
  - target:
      kind: Deployment
      name: matiassystem
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 10m, memory: 64Mi, ephemeral-storage: 32Mi }
          limits: { cpu: 250m, memory: 192Mi, ephemeral-storage: 128Mi }
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 10m, memory: 64Mi, ephemeral-storage: 32Mi }
          limits: { cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi }
