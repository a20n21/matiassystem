apiVersion: apps/v1
kind: Deployment
metadata:
  name: matiassystem
  labels:
    app: matiassystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matiassystem
  template:
    metadata:
      labels:
        app: matiassystem
    spec:
      # O site não usa a API do Kubernetes, então não precisa do token da service account
      automountServiceAccountToken: false
      # Credencial do GHCR (imagem privada). Criada à mão em cada namespace, fora do Git.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Única área gravável: o nginx grava pid e arquivos temporários em /tmp
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: web
          # Nome/tag substituídos por cada overlay (images: no kustomization.yaml)
          image: matiassystem:1.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
