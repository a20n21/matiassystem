name: pr-check

# Valida tudo antes do merge. Não publica nada.
# Roda em push em qualquer branch exceto main; o PR mostra os checks do commit.
# Não usamos pull_request: em repo público, PRs abertos pelo bot (promoções)
# exigem aprovação manual para rodar e a execução expira sem ninguém aprovar.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Renderizar Kustomize (dev, hml, prod)
        run: |
          for env in dev hml prod; do
            echo "::group::$env"
            kubectl kustomize "k8s/overlays/$env"
            echo "::endgroup::"
          done

  build-scan:
    name: build-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          push: false
          tags: matiassystem:pr-check
          cache-from: type=gha
      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: matiassystem:pr-check
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # só bloqueia o que já tem correção disponível
          exit-code: "1"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Procurar segredos no código (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
