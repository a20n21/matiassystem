name: promote

# Esteira: dev → hml → prod, sem cliques além da aprovação de prod.
#
#   build-and-deploy-dev ──dispara──► promote(hml)  : abre PR, espera checks, merge
#                                        └─dispara──► promote(prod) : ⏸ aprovação no Environment
#                                                                    "production", abre PR,
#                                                                    espera checks, merge
#
# Também pode ser disparado à mão (Actions → promote → Run workflow).
# Encadeamos via workflow_dispatch porque merges/pushes feitos com GITHUB_TOKEN
# não disparam outros workflows (workflow_dispatch é a exceção).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente de destino
        type: choice
        options: [hml, prod]

permissions:
  contents: write        # merge do PR de promoção
  pull-requests: write   # abrir o PR
  actions: write         # disparar a próxima etapa (hml → prod)
  statuses: read         # ler o resultado do ZAP (security/zap-hml)

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  # Roda antes da aprovação do Environment: se a promoção for inválida,
  # ninguém chega a receber o pedido de aprovação.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear prod com promoção de hml pendente
        if: inputs.target == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("promote/hml-")) | "#\(.number) \(.headRefName)"')
          if [ -n "$pending" ]; then
            echo "::error::Há promoção para hml ainda não mergeada: $pending. Faça o merge (ou feche) antes de promover para prod; senão o prod receberia a versão antiga do hml."
            exit 1
          fi
          echo "Nenhuma promoção de hml pendente."

      - uses: actions/checkout@v5
        if: inputs.target == 'prod'

      # O Job do ZAP (PostSync da hml) publica security/zap-hml no commit da versão testada.
      # Esperamos esse resultado: só com success alguém recebe o pedido de aprovação.
      - name: Exigir ZAP verde na hml
        if: inputs.target == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(yq '.images[] | select(.name == "matiassystem") | .newTag' k8s/overlays/hml/kustomization.yaml)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          echo "Versão na hml: $TAG ($SHA). Aguardando security/zap-hml..."
          # hml precisa sincronizar (polling do Argo CD, até ~3 min) e o ZAP rodar (~4 min)
          for i in $(seq 1 75); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              --jq '[.[] | select(.context == "security/zap-hml")][0] | "\(.state)|\(.description)"')
            state=${status%%|*}
            case "$state" in
              success)
                echo "::notice::ZAP aprovou a versão $TAG na hml: ${status#*|}"
                exit 0 ;;
              failure|error)
                echo "::error::ZAP reprovou a versão $TAG na hml: ${status#*|}. Veja: kubectl -n matiassystem-hml logs job/zap-baseline"
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Nenhum resultado do ZAP para $TAG em 25 min. O Job rodou? O Secret zap-github-status existe na hml?"
          exit 1

  promote:
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'homologacao' }}
    env:
      TARGET: ${{ inputs.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Push pela deploy key: dispara o pr-check na branch promote/**
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Ler versão do ambiente de origem
        run: |
          if [ "$TARGET" = "prod" ]; then SOURCE=hml; else SOURCE=dev; fi
          f="k8s/overlays/$SOURCE/kustomization.yaml"
          IMAGE=$(yq '.images[] | select(.name == "matiassystem") | .newName' "$f")
          TAG=$(yq '.images[] | select(.name == "matiassystem") | .newTag' "$f")
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Promovendo $IMAGE:$TAG de $SOURCE para $TARGET"

      - name: Atualizar overlay de destino
        run: |
          f="k8s/overlays/$TARGET/kustomization.yaml"
          yq -i '(.images[] | select(.name == "matiassystem")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' "$f"
          if git diff --quiet; then
            echo "::notice::$TARGET já está na versão $TAG. Nada a promover."
            echo "NOTHING=1" >> "$GITHUB_ENV"
          fi
          git diff

      - name: Abrir PR de promoção
        if: env.NOTHING != '1'
        run: |
          BRANCH="promote/$TARGET-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "promote($TARGET): matiassystem $TAG"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "promote($TARGET): matiassystem $TAG" \
            --body "Promoção automática de **$SOURCE → $TARGET**.

          - Imagem: \`$IMAGE:$TAG\`
          - Commit de origem: ${{ github.server_url }}/${{ github.repository }}/commit/$TAG
          - Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Após o merge, o Argo CD aplica sozinho em \`matiassystem-$TARGET\`." \
            || echo "::notice::PR para $BRANCH já existe"
          echo "PR=$(gh pr view "$BRANCH" --json number --jq .number)" >> "$GITHUB_ENV"

      - name: Esperar o pr-check
        if: env.NOTHING != '1'
        run: |
          # Os checks levam alguns segundos para serem registrados depois do push
          for i in $(seq 1 30); do
            n=$(gh pr checks "$PR" --json name --jq 'length' 2>/dev/null || echo 0)
            [ "$n" -ge 3 ] && break
            sleep 10
          done
          gh pr checks "$PR" --watch --fail-fast --interval 15

      - name: Merge do PR
        if: env.NOTHING != '1'
        run: gh pr merge "$PR" --merge --delete-branch

      - name: Disparar promoção para prod
        if: env.NOTHING != '1' && inputs.target == 'hml'
        run: |
          gh workflow run promote.yaml --ref main -f target=prod
          echo "::notice::Promoção para prod disparada. Aguardando aprovação no Environment production."
