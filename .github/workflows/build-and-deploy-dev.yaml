name: build-and-deploy-dev

# Roda quando o site muda (app/) ou manualmente pela aba Actions.
# O commit de tag que este workflow faz em k8s/ não dispara ele de novo.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-and-deploy-dev.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # publicar a imagem no GHCR
  actions: write    # disparar a promoção para hml

# Evita duas execuções simultâneas brigando pelo mesmo commit de tag
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/matiassystem

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # O commit da tag vai direto no main protegido: só a deploy key tem bypass
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Definir tag (hash curto do commit)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Atualizar tag no overlay de dev
        run: |
          yq -i '(.images[] | select(.name == "matiassystem")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' \
            k8s/overlays/dev/kustomization.yaml
          git diff

      - name: Commit da tag nova
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && { echo "Tag já atualizada"; exit 0; }
          git commit -m "deploy(dev): matiassystem ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Disparar promoção para hml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run promote.yaml --ref main -f target=hml
          echo "::notice::Promoção para hml disparada."
