server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        index index.html;
        # Mostra o nome do pod que respondeu (útil para ver o balanceamento)
        sub_filter '__HOSTNAME__' '$hostname';
        sub_filter_once on;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
