server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Não expor a versão do nginx (header Server e páginas de erro)
    server_tokens off;

    # Headers de segurança (verificados pelo ZAP na homologação).
    # "always" inclui respostas de erro (404, 500).
    # Atenção: um add_header dentro de um location anula todos estes.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        index index.html;
        # Mostra o nome do pod que respondeu (útil para ver o balanceamento)
        sub_filter '__HOSTNAME__' '$hostname';
        sub_filter_once on;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
