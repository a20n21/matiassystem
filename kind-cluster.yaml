kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: matiassystem
nodes:
  # v1.34 ainda suporta cgroup v1 (Docker Desktop/WSL atual); K8s >= 1.35 exige cgroup v2
  - role: control-plane
    image: kindest/node:v1.34.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.0
